# Genera guías de compra con la API de Claude, abre un Pull Request y lo mergea solo si pasan
# npm test y npm run build. No usa Claude Code: llama a la API con el SDK, igual que el script semanal.
#
# • Todos los días a las 6:00 de Lima (11:00 UTC): 2 guías de una categoría que rota cada día.
#   Claude elige los temas y prioriza los productos del catálogo con menos guías.
# • A mano: Actions → Generar guías de compra → Run workflow → categoría, cantidad y temas opcionales.
#
# Cada guía se valida con las mismas reglas del build; si no cumple, se le pide a Claude que la corrija
# (máximo 2 veces). El PR trae el costo estimado. El merge automático solo ocurre si main no cambió
# durante la ejecución, para que lo que se publica sea exactamente lo que se probó.

name: Generar guías de compra

on:
  schedule:
    - cron: '0 11 * * *' # 6:00 en Lima (UTC-5, sin horario de verano)
  workflow_dispatch:
    inputs:
      categoria:
        description: 'Categoría de las guías (si agregas una categoría al catálogo, súmala aquí)'
        type: choice
        options: [componentes, perifericos, monitores, almacenamiento]
      cantidad:
        description: 'Cuántas guías generar'
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
      temas:
        description: 'Temas opcionales, separados por punto y coma (ej.: cómo elegir un SSD NVMe; fuente de poder para PC gamer)'
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

# Compartido con "Actualizar catálogo": los dos workflows mergean a main, así que nunca corren a la vez.
concurrency:
  group: tienda-bot
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La última versión de main, no la del momento en que se lanzó la ejecución: si esperó en cola
          # a que otra terminara, así ve las guías que esa otra acaba de publicar.
          ref: ${{ github.event.repository.default_branch }}

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Anotar la versión de main que se va a probar
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Generar guías con Claude
        env:
          # La clave solo existe como secreto de GitHub; nunca se escribe en el código.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Mismo modelo y opciones que el script semanal (Settings → Secrets and variables → Actions → Variables).
          CLAUDE_MODELO: ${{ vars.CLAUDE_MODELO }}
          CLAUDE_ESFUERZO: ${{ vars.CLAUDE_ESFUERZO }}
          BUSQUEDA_WEB: ${{ vars.BUSQUEDA_WEB }}
          # Límites propios de las guías: son más largas que las propuestas del catálogo.
          MAX_BUSQUEDAS_POR_CATEGORIA: ${{ vars.MAX_BUSQUEDAS_POR_GUIA || '5' }}
          MAX_TOKENS_RESPUESTA: ${{ vars.MAX_TOKENS_RESPUESTA_GUIAS || '20000' }}
          MAX_TOKENS_EJECUCION: ${{ vars.MAX_TOKENS_EJECUCION_GUIAS || '600000' }}
          # En el horario diario no hay formulario: categoría rotativa y 2 guías.
          CATEGORIA: ${{ inputs.categoria || 'auto' }}
          CANTIDAD: ${{ inputs.cantidad || '2' }}
          TEMAS: ${{ inputs.temas || '' }}
        run: node scripts/generar-guias.mjs --categoria "$CATEGORIA" --cantidad "$CANTIDAD" --temas="$TEMAS"

      - name: Pruebas
        run: npm test

      - name: Comprobar que la web compila
        run: npm run build

      - name: Abrir el Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: bot/guias-${{ github.run_id }}
          BASE: ${{ github.event.repository.default_branch }}
          DUENO: ${{ github.repository_owner }}
        run: |
          CATEGORIA="$(node -p "require('./tmp/resumen-guias.json').categoria")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$RAMA"
          git add src/content/guias
          if git diff --cached --quiet; then
            echo "::error::No hay guías nuevas para subir."
            exit 1
          fi
          git commit -m "Guías de compra generadas: $CATEGORIA"
          git push origin "HEAD:$RAMA"
          gh pr create --base "$BASE" --head "$RAMA" \
            --title "Guías de compra: $CATEGORIA ($(date -u +%F))" \
            --body-file tmp/resumen-guias.md
          gh pr edit "$RAMA" --add-assignee "$DUENO" || echo "::warning::No se pudo asignar el PR a $DUENO."

      # Solo llega aquí si las pruebas y el build pasaron (cualquier paso fallido detiene el job).
      # Para apagarlo sin tocar el código: variable MERGE_AUTOMATICO = no.
      - name: Merge automático
        if: vars.MERGE_AUTOMATICO != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: bot/guias-${{ github.run_id }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          ACTUAL="$(git ls-remote origin "refs/heads/$BASE" | cut -f1)"
          if [ "$ACTUAL" != "$BASE_SHA" ]; then
            echo "::warning::$BASE cambió durante la ejecución; el PR queda abierto para revisión."
            gh pr comment "$RAMA" --body "No se hizo merge automático: \`$BASE\` cambió mientras se generaban las guías, así que las pruebas no cubren el resultado combinado. Revísalo y haz merge a mano, o vuelve a ejecutar el workflow."
            exit 0
          fi
          gh pr merge "$RAMA" --merge --delete-branch --match-head-commit "$(git rev-parse HEAD)"

      - name: Resumen de la ejecución
        if: always()
        run: |
          if [ -f tmp/resumen-guias.md ]; then cat tmp/resumen-guias.md >> "$GITHUB_STEP_SUMMARY"; fi
