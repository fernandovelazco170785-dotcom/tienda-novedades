# Actualiza data/*.json, abre un Pull Request y lo mergea solo si pasan npm test y npm run build.
#
# Cuándo corre:
#   • Cada lunes (schedule): publica pendientes con enlace y pide propuestas nuevas a Claude.
#   • A mano (Actions → Actualizar catálogo → Run workflow): "completo" o "solo_publicar" (sin costo).
#   • Cuando editas data/pendientes.json en main (o en la rama del bot): publica los que ya tienen
#     enlace de afiliado, sin usar la API.
#
# El merge automático solo ocurre si main no cambió durante la ejecución, para que lo que se publica
# sea exactamente lo que se probó. Si no se puede mergear, el PR queda abierto: las ejecuciones
# siguientes suman sus cambios a ese mismo PR sin pisar tus ediciones.
#
# Avisos: GitHub te notifica del PR (te lo asigna) y de las fallas. El correo con Resend es opcional
# y queda desactivado mientras no exista el secreto RESEND_API_KEY.

name: Actualizar catálogo

on:
  schedule:
    - cron: '47 11 * * 1' # lunes 11:47 UTC (6:47 en Lima/Bogotá)
  workflow_dispatch:
    inputs:
      modo:
        description: 'completo = propuestas nuevas con Claude (usa la API) · solo_publicar = sin costo'
        type: choice
        options: [completo, solo_publicar]
        default: completo
  push:
    branches: [main, bot/actualizacion-catalogo]
    paths: [data/pendientes.json]

permissions:
  contents: write
  pull-requests: write

# Compartido con "Generar guías de compra": los dos workflows mergean a main, así que nunca corren a la vez.
concurrency:
  group: tienda-bot
  cancel-in-progress: false

env:
  RAMA: bot/actualizacion-catalogo
  BASE: ${{ github.event.repository.default_branch }}
  MODO: ${{ github.event_name == 'push' && 'solo_publicar' || inputs.modo || 'completo' }}
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Elegir la rama de trabajo
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Siempre se trabaja sobre la última versión de main, aunque esta ejecución haya esperado en cola.
          git fetch origin "$BASE"
          echo "BASE_SHA=$(git rev-parse "origin/$BASE")" >> "$GITHUB_ENV"
          if { [ "$EVENTO" = "push" ] && [ "$REF" = "$RAMA" ]; } || \
             [ "$(gh pr list --head "$RAMA" --state open --json number --jq length)" != "0" ]; then
            # Hay un PR del bot sin mergear (o editaste su rama): se suman los cambios ahí, con lo nuevo de main.
            git fetch origin "$RAMA"
            git checkout -B "$RAMA" "origin/$RAMA"
            if ! git merge --no-edit "origin/$BASE"; then
              echo "::error::La rama $RAMA tiene conflictos con $BASE. Resuélvelos en el PR o ciérralo para empezar de cero."
              exit 1
            fi
            echo "PR_ABIERTO=si" >> "$GITHUB_ENV"
          else
            git checkout -B "$RAMA" "origin/$BASE"
            echo "PR_ABIERTO=no" >> "$GITHUB_ENV"
          fi

      - name: Actualizar datos (${{ env.MODO }})
        env:
          # La clave solo existe como secreto de GitHub; nunca se escribe en el código ni llega a la web.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Límites opcionales (Settings → Secrets and variables → Actions → Variables).
          CLAUDE_MODELO: ${{ vars.CLAUDE_MODELO }}
          CLAUDE_ESFUERZO: ${{ vars.CLAUDE_ESFUERZO }}
          BUSQUEDA_WEB: ${{ vars.BUSQUEDA_WEB }}
          MAX_PRODUCTOS_NUEVOS: ${{ vars.MAX_PRODUCTOS_NUEVOS }}
          MAX_POR_CATEGORIA: ${{ vars.MAX_POR_CATEGORIA }}
          MAX_PENDIENTES: ${{ vars.MAX_PENDIENTES }}
          MAX_RETIROS: ${{ vars.MAX_RETIROS }}
          MAX_BUSQUEDAS_POR_CATEGORIA: ${{ vars.MAX_BUSQUEDAS_POR_CATEGORIA }}
          MAX_TOKENS_RESPUESTA: ${{ vars.MAX_TOKENS_RESPUESTA }}
          MAX_TOKENS_EJECUCION: ${{ vars.MAX_TOKENS_EJECUCION }}
        run: node scripts/actualizar.mjs --modo "$MODO"

      - name: Pruebas
        run: npm test

      - name: Comprobar que la web compila
        run: npm run build

      - name: Guardar los cambios en la rama del bot
        id: guardar
        run: |
          git add data/products.json data/pendientes.json data/descartados.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el catálogo."
            echo "hay_cambios=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Catálogo: actualización ($MODO) $(date -u +%F)"
            echo "hay_cambios=si" >> "$GITHUB_OUTPUT"
          fi
          if [ "$PR_ABIERTO" = "si" ]; then
            # Sube también el merge de main hecho arriba, aunque no haya datos nuevos: así el PR abierto
            # queda igual a lo que se acaba de probar y el merge automático lo puede volver a intentar.
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$RAMA")" ]; then git push origin "HEAD:$RAMA"; fi
          elif [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            # Rama nueva desde main: reemplaza lo que quedara de un PR anterior ya cerrado.
            git push --force origin "HEAD:$RAMA"
          fi

      - name: Abrir el Pull Request o comentar el resumen
        id: pr
        if: steps.guardar.outputs.hay_cambios == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          DUENO: ${{ github.repository_owner }}
        run: |
          if [ "$PR_ABIERTO" = "si" ]; then
            gh pr comment "$RAMA" --body-file tmp/resumen.md || echo "::warning::No hay un PR abierto para $RAMA; los cambios quedaron en la rama."
          else
            gh pr create --base "$BASE" --head "$RAMA" \
              --title "Actualización del catálogo ($(date -u +%F))" \
              --body-file tmp/resumen.md
            # Asignarte el PR hace que GitHub te avise directamente.
            gh pr edit "$RAMA" --add-assignee "$DUENO" || echo "::warning::No se pudo asignar el PR a $DUENO."
          fi
          echo "url=$(gh pr view "$RAMA" --json url --jq .url 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      # Solo llega aquí si las pruebas y el build pasaron (cualquier paso fallido detiene el job).
      # Para apagarlo sin tocar el código: variable MERGE_AUTOMATICO = no.
      # También reintenta el PR que quedó abierto en una ejecución anterior.
      - name: Merge automático
        if: (steps.guardar.outputs.hay_cambios == 'si' || env.PR_ABIERTO == 'si') && vars.MERGE_AUTOMATICO != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr view "$RAMA" --json state --jq .state 2>/dev/null)" != "OPEN" ]; then
            echo "::warning::No hay un PR abierto para $RAMA; no hay nada que mergear."
            exit 0
          fi
          ACTUAL="$(git ls-remote origin "refs/heads/$BASE" | cut -f1)"
          if [ "$ACTUAL" != "$BASE_SHA" ]; then
            echo "::warning::$BASE cambió durante la ejecución; el PR queda abierto para revisión."
            gh pr comment "$RAMA" --body "No se hizo merge automático: \`$BASE\` cambió durante la ejecución, así que las pruebas no cubren el resultado combinado. La próxima ejecución lo vuelve a intentar; también puedes hacer merge a mano."
            exit 0
          fi
          gh pr merge "$RAMA" --merge --delete-branch --match-head-commit "$(git rev-parse HEAD)"

      - name: Resumen de la ejecución
        if: always()
        run: |
          if [ -f tmp/resumen.md ]; then cat tmp/resumen.md >> "$GITHUB_STEP_SUMMARY"; fi

      # Opcional: no hace nada hasta que exista el secreto RESEND_API_KEY.
      # Avisa cuando hay cambios y cuando la ejecución falla. No avisa por tus propias ediciones (push).
      - name: Aviso por correo (Resend)
        if: always() && github.event_name != 'push'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CORREO_AVISOS: ${{ secrets.CORREO_AVISOS }}
          CORREO_REMITENTE: ${{ vars.CORREO_REMITENTE }}
          RESULTADO: ${{ job.status }}
          HAY_CAMBIOS: ${{ steps.guardar.outputs.hay_cambios }}
          PR_URL: ${{ steps.pr.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/enviar-correo.mjs
